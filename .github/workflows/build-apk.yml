name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STOREPASS="${KEYSTORE_PASSWORD:-tradevision123}"
          KEYPASS="${KEY_PASSWORD:-tradevision123}"
          ALIAS="${KEY_ALIAS:-tradevision}"
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ "${KEYSTORE_BASE64}" != "" ]; then
            CLEAN=$(echo "${KEYSTORE_BASE64}" | tr -d '[:space:]')
            echo "${CLEAN}" | base64 --decode > app/keystore/release.jks 2>/dev/null || true
            if [ -f app/keystore/release.jks ] && [ -s app/keystore/release.jks ]; then
              if keytool -list -keystore app/keystore/release.jks -storepass "${STOREPASS}" >/dev/null 2>&1; then
                echo "✅ User keystore decoded"
              else
                rm -f app/keystore/release.jks
              fi
            fi
          fi
          mkdir -p app/keystore
          if [ ! -f app/keystore/release.jks ]; then
            keytool -genkeypair -v -keystore app/keystore/release.jks -alias "${ALIAS}" -keyalg RSA -keysize 2048 -validity 10000 -storepass "${STOREPASS}" -keypass "${KEYPASS}" -dname "CN=TradeVision, OU=Dev, O=TradeVision, L=Tehran, ST=Tehran, C=IR"
            echo "✅ Keystore generated"
          fi
          ls -la app/keystore/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build-output.txt; exit ${PIPESTATUS[0]}

      - name: Save build log
        if: always()
        run: |
          echo "=== BUILD LOG TAIL ==="
          tail -100 build-output.txt || echo "No build output"
          cp build-output.txt /tmp/build-log.txt 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt
          retention-days: 1

      - name: Find APK
        if: success()
        run: ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No APK found"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TradeVision-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30