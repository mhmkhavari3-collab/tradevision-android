<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TradeVision v8</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;
  background:#0a0e17;
  color:#e1e5ee;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
#app{display:flex;flex-direction:column;height:100%;width:100%}
/* Header */
.header{
  background:#111827;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #1f2937;
  flex-shrink:0;
  z-index:100;
}
.header h1{font-size:16px;font-weight:700;color:#10b981;letter-spacing:0.5px}
.header .status{font-size:11px;color:#6b7280}
.header .ws-dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:#ef4444;margin-right:5px;vertical-align:middle;
}
.header .ws-dot.connected{background:#10b981}
/* Pages */
.page{flex:1;overflow:hidden;display:none;flex-direction:column}
.page.active{display:flex}
/* Watchlist */
.watchlist{flex:1;overflow-y:auto;padding:6px 0}
.watchlist-group{padding:4px 14px;font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-top:8px}
.symbol-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid #111827;cursor:pointer;
  transition:background 0.15s;
}
.symbol-row:active{background:#1f2937}
.symbol-row .left{display:flex;flex-direction:column}
.symbol-row .name{font-size:14px;font-weight:600;color:#f9fafb}
.symbol-row .type{font-size:10px;color:#6b7280;margin-top:1px}
.symbol-row .right{text-align:right}
.symbol-row .price{font-size:14px;font-weight:600;color:#e1e5ee;font-variant-numeric:tabular-nums}
.symbol-row .change{font-size:11px;margin-top:1px}
.symbol-row .change.up{color:#10b981}
.symbol-row .change.down{color:#ef4444}
.symbol-row .change.flat{color:#6b7280}
/* Chart page */
.chart-page{display:flex;flex-direction:column;height:100%}
.chart-header{
  background:#111827;padding:10px 14px;display:flex;align-items:center;
  border-bottom:1px solid #1f2937;flex-shrink:0;
}
.chart-header .back-btn{
  background:none;border:none;color:#10b981;font-size:20px;
  padding:0 10px 0 0;cursor:pointer;font-weight:bold;
}
.chart-header .symbol-info{flex:1}
.chart-header .symbol-name{font-size:15px;font-weight:700;color:#f9fafb}
.chart-header .symbol-price{font-size:13px;color:#e1e5ee;margin-top:1px;font-variant-numeric:tabular-nums}
.chart-container{flex:1;position:relative;background:#0a0e17;overflow:hidden}
.chart-container canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.chart-info{
  position:absolute;top:8px;left:10px;font-size:11px;color:#6b7280;
  pointer-events:none;z-index:5;
}
.chart-info .ohlc{display:flex;gap:10px}
.chart-info .ohlc span{color:#9ca3af}
.chart-loading{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  color:#6b7280;font-size:13px;
}
.chart-tf-bar{
  background:#111827;padding:6px 10px;display:flex;gap:6px;flex-shrink:0;
  border-bottom:1px solid #1f2937;overflow-x:auto;
}
.tf-btn{
  background:#1f2937;border:1px solid #374151;color:#9ca3af;
  padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;
  white-space:nowrap;
}
.tf-btn.active{background:#10b981;color:#fff;border-color:#10b981}
/* Error overlay */
.error-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(10,14,23,0.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;padding:20px;
}
.error-overlay .err-icon{font-size:40px;margin-bottom:12px}
.error-overlay .err-title{font-size:18px;font-weight:700;color:#ef4444;margin-bottom:8px}
.error-overlay .err-msg{font-size:13px;color:#9ca3af;text-align:center;max-width:300px;line-height:1.5}
.error-overlay .err-dismiss{
  margin-top:16px;background:#1f2937;border:1px solid #374151;
  color:#e1e5ee;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:13px;
}
.hidden{display:none!important}
/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#374151;border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header">
    <h1>⚡ TradeVision</h1>
    <div class="status">
      <span class="ws-dot" id="wsDot"></span>
      <span id="wsStatus">Disconnected</span>
    </div>
  </div>

  <!-- Watchlist Page -->
  <div class="page active" id="watchlistPage">
    <div class="watchlist" id="watchlist"></div>
  </div>

  <!-- Chart Page -->
  <div class="page chart-page" id="chartPage">
    <div class="chart-header">
      <button class="back-btn" id="backBtn">◀</button>
      <div class="symbol-info">
        <div class="symbol-name" id="chartSymbolName">-</div>
        <div class="symbol-price" id="chartSymbolPrice">-</div>
      </div>
    </div>
    <div class="chart-tf-bar" id="tfBar"></div>
    <div class="chart-container" id="chartContainer">
      <canvas id="chartCanvas"></canvas>
      <div class="chart-info" id="chartInfo">
        <div class="ohlc" id="ohlcInfo"></div>
      </div>
      <div class="chart-loading" id="chartLoading">Loading candles...</div>
    </div>
  </div>
</div>

<!-- Error overlay -->
<div class="error-overlay hidden" id="errorOverlay">
  <div class="err-icon">⚠️</div>
  <div class="err-title" id="errTitle">Connection Error</div>
  <div class="err-msg" id="errMsg">Unable to connect to data source.</div>
  <button class="err-dismiss" id="errDismiss">Dismiss</button>
</div>

<script>
(function(){
'use strict';

// ─── CONFIG ────────────────────────────────────────────────────
var BASE = 'https://market-stream.mamali163345.workers.dev';
var WS_BASE = 'wss://market-stream.mamali163345.workers.dev';

var SYMBOLS = [
  {sym:'XAUUSD',label:'Gold',type:'metal',prec:2},
  {sym:'XAGUSD',label:'Silver',type:'metal',prec:3},
  {sym:'WTI',label:'WTI Crude',type:'commodity',prec:2},
  {sym:'BRENT',label:'Brent Crude',type:'commodity',prec:2},
  {sym:'EURUSD',label:'EUR/USD',type:'forex',prec:5},
  {sym:'GBPUSD',label:'GBP/USD',type:'forex',prec:5},
  {sym:'USDJPY',label:'USD/JPY',type:'forex',prec:3},
  {sym:'AUDUSD',label:'AUD/USD',type:'forex',prec:5},
  {sym:'USDCHF',label:'USD/CHF',type:'forex',prec:5},
  {sym:'USDCAD',label:'USD/CAD',type:'forex',prec:5},
  {sym:'NZDUSD',label:'NZD/USD',type:'forex',prec:5},
  {sym:'EURGBP',label:'EUR/GBP',type:'forex',prec:5},
  {sym:'EURJPY',label:'EUR/JPY',type:'forex',prec:3},
  {sym:'GBPJPY',label:'GBP/JPY',type:'forex',prec:3},
  {sym:'BTC-USDT',label:'BTC/USDT',type:'crypto',prec:2},
  {sym:'ETH-USDT',label:'ETH/USDT',type:'crypto',prec:2},
  {sym:'SOL-USDT',label:'SOL/USDT',type:'crypto',prec:2}
];

var TIMEFRAMES = ['1m','5m','15m','30m','1h','4h','1d'];
var CURRENT_TF = '15m';

// ─── STATE ─────────────────────────────────────────────────────
var prices = {};       // sym -> {bid,ask,last,change,ts}
var currentPage = 'watchlist';
var activeSymbol = null;
var candles = [];
var ws = null;
var wsReconnectTimer = null;
var chartCanvas, chartCtx;
var chartW = 0, chartH = 0;
var hoveredCandle = -1;
var panOffset = 0;
var lastTouchX = 0;
var isDragging = false;
var renderRAF = null;

// ─── HELPERS ───────────────────────────────────────────────────
function prec(sym){
  var s = SYMBOLS.find(function(x){return x.sym===sym});
  return s?s.prec:2;
}
function fmtPrice(sym,p){
  if(p==null||isNaN(p)) return '-';
  return Number(p).toFixed(prec(sym));
}
function showErr(title,msg){
  document.getElementById('errTitle').textContent=title;
  document.getElementById('errMsg').textContent=msg;
  document.getElementById('errorOverlay').classList.remove('hidden');
}
function hideErr(){
  document.getElementById('errorOverlay').classList.add('hidden');
}

// ─── WATCHLIST RENDER ──────────────────────────────────────────
function renderWatchlist(){
  var wl = document.getElementById('watchlist');
  var groups = {metal:[],commodity:[],forex:[],crypto:[]};
  SYMBOLS.forEach(function(s){groups[s.type].push(s)});
  var html='';
  var order=['metal','commodity','forex','crypto'];
  var gLabels={metal:'Metals',commodity:'Energy',forex:'Forex',crypto:'Crypto'};
  order.forEach(function(g){
    if(!groups[g].length) return;
    html+='<div class="watchlist-group">'+gLabels[g]+'</div>';
    groups[g].forEach(function(s){
      var p = prices[s.sym];
      var priceStr = p ? fmtPrice(s.sym, p.last) : '...';
      var chg = p && p.change!=null ? p.change : null;
      var chgClass = 'flat';
      var chgText = '-';
      if(chg!=null){
        chgClass = chg>0?'up':(chg<0?'down':'flat');
        chgText = (chg>=0?'+':'')+chg.toFixed(2)+'%';
      }
      html+='<div class="symbol-row" data-sym="'+s.sym+'">';
      html+='  <div class="left"><span class="name">'+s.label+'</span><span class="type">'+s.sym+'</span></div>';
      html+='  <div class="right"><span class="price" id="wp_'+s.sym+'">'+priceStr+'</span>';
      html+='  <div class="change '+chgClass+'" id="wc_'+s.sym+'">'+chgText+'</div></div>';
      html+='</div>';
    });
  });
  wl.innerHTML=html;
  // Bind clicks
  wl.querySelectorAll('.symbol-row').forEach(function(row){
    row.addEventListener('click',function(){
      openChart(row.getAttribute('data-sym'));
    });
  });
}

function updateWatchlistPrice(sym,lastVal,changeVal){
  var pe=document.getElementById('wp_'+sym);
  var ce=document.getElementById('wc_'+sym);
  if(pe) pe.textContent=fmtPrice(sym,lastVal);
  if(ce){
    var chgClass='flat';
    if(changeVal!=null) chgClass=changeVal>0?'up':(changeVal<0?'down':'flat');
    ce.className='change '+chgClass;
    ce.textContent=changeVal!=null?(changeVal>=0?'+':'')+changeVal.toFixed(2)+'%':'-';
  }
}

// ─── PAGE NAVIGATION ───────────────────────────────────────────
function openChart(sym){
  activeSymbol=sym;
  currentPage='chart';
  document.getElementById('watchlistPage').classList.remove('active');
  document.getElementById('chartPage').classList.add('active');
  var s=SYMBOLS.find(function(x){return x.sym===sym});
  document.getElementById('chartSymbolName').textContent=s?s.label:sym;
  document.getElementById('chartSymbolPrice').textContent=fmtPrice(sym,prices[sym]?prices[sym].last:null);
  buildTFBar();
  loadCandles(sym);
  connectWS(sym);
  try{history.pushState({page:'chart',sym:sym},'',location.href)}catch(e){}
}

function closeChart(){
  currentPage='watchlist';
  document.getElementById('chartPage').classList.remove('active');
  document.getElementById('watchlistPage').classList.add('active');
  if(ws){try{ws.close()}catch(e){}ws=null}
  if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null}
  try{history.pushState({page:'watchlist'},'',location.href)}catch(e){}
}

// ─── TIMEFRAME BAR ─────────────────────────────────────────────
function buildTFBar(){
  var bar=document.getElementById('tfBar');
  var html='';
  TIMEFRAMES.forEach(function(tf){
    html+='<button class="tf-btn'+(tf===CURRENT_TF?' active':'')+'" data-tf="'+tf+'">'+tf+'</button>';
  });
  bar.innerHTML=html;
  bar.querySelectorAll('.tf-btn').forEach(function(btn){
    btn.addEventListener('click',function(){
      CURRENT_TF=btn.getAttribute('data-tf');
      bar.querySelectorAll('.tf-btn').forEach(function(b){b.classList.remove('active')});
      btn.classList.add('active');
      if(activeSymbol) loadCandles(activeSymbol);
    });
  });
}

// ─── DATA FETCHING ─────────────────────────────────────────────
function fetchPrices(){
  var syms=SYMBOLS.map(function(s){return s.sym}).join(',');
  fetch(BASE+'/price?symbols='+syms)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(data){
      // data could be object keyed by symbol, or array
      if(Array.isArray(data)){
        data.forEach(function(d){
          var sym=d.symbol||d.sym||d.s;
          if(!sym)return;
          var bid=parseFloat(d.bid||d.b||d.price||d.last||0);
          var ask=parseFloat(d.ask||d.a||d.price||d.last||0);
          var last=bid||ask||parseFloat(d.last||d.l||0);
          var chg=parseFloat(d.change||d.chg||d.pct||0);
          prices[sym]={bid:bid,ask:ask,last:last,change:chg,ts:Date.now()};
          updateWatchlistPrice(sym,last,chg);
        });
      } else if(typeof data==='object'){
        Object.keys(data).forEach(function(sym){
          var d=data[sym];
          if(typeof d==='number'){
            prices[sym]={bid:d,ask:d,last:d,change:null,ts:Date.now()};
          } else if(typeof d==='object'&&d!==null){
            var bid=parseFloat(d.bid||d.b||0);
            var ask=parseFloat(d.ask||d.a||0);
            var last=bid||ask||parseFloat(d.last||d.l||0);
            var chg=parseFloat(d.change||d.chg||d.pct||0);
            prices[sym]={bid:bid,ask:ask,last:last,change:chg,ts:Date.now()};
          }
          updateWatchlistPrice(sym,prices[sym]?prices[sym].last:null,prices[sym]?prices[sym].change:null);
        });
      }
    })
    .catch(function(e){
      console.warn('Price fetch failed:',e.message);
      // Don't show full-screen error for price fetch - just log
    });
}

function loadCandles(sym){
  var loading=document.getElementById('chartLoading');
  loading.style.display='block';
  loading.textContent='Loading candles...';
  candles=[];
  hoveredCandle=-1;
  panOffset=0;
  fetch(BASE+'/candles?symbol='+sym+'&timeframe='+CURRENT_TF+'&count=100')
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(function(data){
      loading.style.display='none';
      var arr=Array.isArray(data)?data:(data.candles||data.data||data.result||[]);
      candles=arr.map(function(c){
        return {
          time: new Date(c.time||c.t||c.timestamp||c.date).getTime(),
          open: parseFloat(c.open||c.o||0),
          high: parseFloat(c.high||c.h||0),
          low: parseFloat(c.low||c.l||0),
          close: parseFloat(c.close||c.c||0)
        };
      }).sort(function(a,b){return a.time-b.time});
      // Auto-pan to show last candles
      panOffset=0;
      renderChart();
    })
    .catch(function(e){
      loading.textContent='Failed to load candles: '+e.message;
      loading.style.display='block';
      console.error('Candle load error:',e);
      // If no candles at all, generate placeholder
      if(candles.length===0){
        generatePlaceholderCandles();
        renderChart();
      }
    });
}

function generatePlaceholderCandles(){
  var sym=activeSymbol;
  var p=prices[sym];
  var base=p?p.last:100;
  candles=[];
  var now=Date.now();
  var tfMs={'1m':60000,'5m':300000,'15m':900000,'30m':1800000,'1h':3600000,'4h':14400000,'86400000':86400000};
  var interval=tfMs[CURRENT_TF]||900000;
  for(var i=100;i>=0;i--){
    var t=now-i*interval;
    var o=base*(0.98+Math.random()*0.04);
    var c=base*(0.98+Math.random()*0.04);
    var h=Math.max(o,c)*(1+Math.random()*0.005);
    var l=Math.min(o,c)*(1-Math.random()*0.005);
    candles.push({time:t,open:o,high:h,low:l,close:c});
  }
}

// ─── WEBSOCKET ─────────────────────────────────────────────────
function connectWS(sym){
  if(ws){try{ws.close()}catch(e){}}
  if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null}
  var dot=document.getElementById('wsDot');
  var statusEl=document.getElementById('wsStatus');
  dot.className='ws-dot';
  statusEl.textContent='Connecting...';
  try{
    ws=new WebSocket(WS_BASE+'/stream?symbol='+sym);
  }catch(e){
    dot.className='ws-dot';
    statusEl.textContent='WS Error';
    console.warn('WebSocket creation failed:',e.message);
    wsReconnectTimer=setTimeout(function(){connectWS(sym)},5000);
    return;
  }
  ws.onopen=function(){
    dot.className='ws-dot connected';
    statusEl.textContent='Live';
  };
  ws.onmessage=function(evt){
    try{
      var msg=JSON.parse(evt.data);
      handleWSMessage(msg,sym);
    }catch(e){}
  };
  ws.onerror=function(e){
    console.warn('WS error:',e);
    dot.className='ws-dot';
    statusEl.textContent='WS Error';
  };
  ws.onclose=function(){
    dot.className='ws-dot';
    statusEl.textContent='Disconnected';
    // Reconnect after 3s
    if(currentPage==='chart'&&activeSymbol===sym){
      wsReconnectTimer=setTimeout(function(){connectWS(sym)},3000);
    }
  };
}

function handleWSMessage(msg,sym){
  // msg could be {symbol,price,bid,ask,...} or {type:'tick',...}
  var price=null, bid=null, ask=null;
  if(msg.price!=null) price=parseFloat(msg.price);
  if(msg.last!=null) price=parseFloat(msg.last);
  if(msg.l!=null) price=parseFloat(msg.l);
  if(msg.bid!=null) bid=parseFloat(msg.bid);
  if(msg.ask!=null) ask=parseFloat(msg.ask);
  if(msg.b!=null) bid=parseFloat(msg.b);
  if(msg.a!=null) ask=parseFloat(msg.a);
  if(price==null&&bid!=null) price=bid;
  if(price==null&&ask!=null) price=ask;
  if(price==null) return;

  // Update prices state
  var old=prices[sym]?prices[sym].last:null;
  var chg=null;
  if(old&&old>0) chg=((price-old)/old)*100;
  prices[sym]={bid:bid||price,ask:ask||price,last:price,change:chg,ts:Date.now()};

  // Update watchlist
  updateWatchlistPrice(sym,price,chg);
  // Update chart header
  if(activeSymbol===sym){
    document.getElementById('chartSymbolPrice').textContent=fmtPrice(sym,price);
  }

  // Update/create candle
  if(candles.length>0){
    var lastCandle=candles[candles.length-1];
    var tfMs={'1m':60000,'5m':300000,'15m':900000,'30m':1800000,'1h':3600000,'4h':14400000,'1d':86400000};
    var interval=tfMs[CURRENT_TF]||900000;
    var candleStart=Math.floor(Date.now()/interval)*interval;

    if(lastCandle.time>=candleStart){
      // Update current candle
      lastCandle.close=price;
      if(price>lastCandle.high) lastCandle.high=price;
      if(price<lastCandle.low) lastCandle.low=price;
    } else {
      // New candle
      candles.push({time:candleStart,open:lastCandle.close,high:Math.max(lastCandle.close,price),low:Math.min(lastCandle.close,price),close:price});
      if(candles.length>200) candles.shift();
      panOffset=0;
    }
    if(currentPage==='chart'&&activeSymbol===sym){
      renderChart();
    }
  }
}

// ─── CANVAS CHART RENDERING ────────────────────────────────────
function initChart(){
  chartCanvas=document.getElementById('chartCanvas');
  chartCtx=chartCanvas.getContext('2d');
  resizeChart();
  // Mouse/touch events for panning and hover
  var container=document.getElementById('chartContainer');
  container.addEventListener('mousedown',onDragStart);
  container.addEventListener('mousemove',onDragMove);
  container.addEventListener('mouseup',onDragEnd);
  container.addEventListener('mouseleave',onDragEnd);
  container.addEventListener('touchstart',onTouchStart,{passive:false});
  container.addEventListener('touchmove',onTouchMove,{passive:false});
  container.addEventListener('touchend',onTouchEnd);
  window.addEventListener('resize',function(){
    resizeChart();
    renderChart();
  });
}

function resizeChart(){
  if(!chartCanvas)return;
  var cont=document.getElementById('chartContainer');
  var dpr=window.devicePixelRatio||1;
  chartW=cont.clientWidth;
  chartH=cont.clientHeight;
  chartCanvas.width=chartW*dpr;
  chartCanvas.height=chartH*dpr;
  chartCanvas.style.width=chartW+'px';
  chartCanvas.style.height=chartH+'px';
  chartCtx.setTransform(dpr,0,0,dpr,0,0);
}

function renderChart(){
  if(!chartCtx||!chartCanvas) return;
  if(renderRAF) cancelAnimationFrame(renderRAF);
  renderRAF=requestAnimationFrame(_doRender);
}

function _doRender(){
  var ctx=chartCtx;
  var W=chartW, H=chartH;
  if(!W||!H) return;
  ctx.clearRect(0,0,W,H);

  if(candles.length===0){
    ctx.fillStyle='#4b5563';
    ctx.font='14px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('No candle data available',W/2,H/2);
    return;
  }

  var MARGIN_TOP=30;
  var MARGIN_BOTTOM=30;
  var MARGIN_LEFT=10;
  var MARGIN_RIGHT=60;
  var chartLeft=MARGIN_LEFT;
  var chartRight=W-MARGIN_RIGHT;
  var chartTop=MARGIN_TOP;
  var chartBottom=H-MARGIN_BOTTOM;
  var chartWidth=chartRight-chartLeft;
  var chartHeight=chartBottom-chartTop;

  // Calculate visible range
  var candleW=Math.max(3,Math.min(20,chartWidth/60));
  var gap=Math.max(1,candleW*0.2);
  var totalCandleW=candleW+gap;
  var maxVisible=Math.floor(chartWidth/totalCandleW);
  var totalCandles=candles.length;
  // Show last maxVisible candles, adjusted by panOffset
  var endIdx=totalCandles-Math.max(0,Math.min(panOffset,maxVisible));
  var startIdx=Math.max(0,endIdx-maxVisible);
  var visible=candles.slice(startIdx,endIdx);
  if(visible.length===0) return;

  // Find price range
  var priceMin=Infinity, priceMax=-Infinity;
  visible.forEach(function(c){
    if(c.low<priceMin) priceMin=c.low;
    if(c.high>priceMax) priceMax=c.high;
  });
  var priceRange=priceMax-priceMin;
  if(priceRange<=0) priceRange=1;
  var pricePad=priceRange*0.08;
  priceMin-=pricePad;
  priceMax+=pricePad;
  priceRange=priceMax-priceMin;

  // Helper: price -> Y
  function priceToY(p){return chartTop+(1-(p-priceMin)/priceRange)*chartHeight}

  // Draw grid lines
  ctx.strokeStyle='#1f2937';
  ctx.lineWidth=0.5;
  ctx.fillStyle='#4b5563';
  ctx.font='10px sans-serif';
  ctx.textAlign='right';
  var gridLines=6;
  for(var i=0;i<=gridLines;i++){
    var p=priceMin+(priceRange*i/gridLines);
    var y=priceToY(p);
    ctx.beginPath();ctx.moveTo(chartLeft,y);ctx.lineTo(chartRight,y);ctx.stroke();
    ctx.fillText(p.toFixed(prec(activeSymbol||'EURUSD')),chartRight+55,y+3);
  }

  // Draw time labels
  ctx.textAlign='center';
  var timeStep=Math.max(1,Math.floor(visible.length/6));
  for(var i=0;i<visible.length;i+=timeStep){
    var c=visible[i];
    var x=chartLeft+(i+0.5)*totalCandleW;
    var d=new Date(c.time);
    var label=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
    ctx.fillStyle='#4b5563';
    ctx.fillText(label,x,chartBottom+14);
  }

  // Draw candles
  var symbolP = prec(activeSymbol||'EURUSD');
  visible.forEach(function(c,i){
    var x=chartLeft+(i+0.5)*totalCandleW;
    var yO=priceToY(c.open);
    var yC=priceToY(c.close);
    var yH=priceToY(c.high);
    var yL=priceToY(c.low);
    var isUp=c.close>=c.open;
    var bodyTop=Math.min(yO,yC);
    var bodyBot=Math.max(yO,yC);
    var bodyH=Math.max(1,bodyBot-bodyTop);

    // Wick
    ctx.strokeStyle=isUp?'#10b981':'#ef4444';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,yH);ctx.lineTo(x,yL);ctx.stroke();

    // Body
    ctx.fillStyle=isUp?'#10b981':'#ef4444';
    if(isUp){
      ctx.strokeStyle='#10b981';
      ctx.lineWidth=1;
      ctx.strokeRect(x-candleW/2,bodyTop,candleW,bodyH);
      // Fill with semi-transparent for bullish
      ctx.fillStyle='rgba(16,185,129,0.3)';
      ctx.fillRect(x-candleW/2,bodyTop,candleW,bodyH);
    } else {
      ctx.fillRect(x-candleW/2,bodyTop,candleW,bodyH);
    }
  });

  // Draw crosshair on hover
  if(hoveredCandle>=0 && hoveredCandle<visible.length){
    var c=visible[hoveredCandle];
    var x=chartLeft+(hoveredCandle+0.5)*totalCandleW;
    ctx.setLineDash([4,3]);
    ctx.strokeStyle='#4b5563';
    ctx.lineWidth=0.7;
    ctx.beginPath();ctx.moveTo(x,chartTop);ctx.lineTo(x,chartBottom);ctx.stroke();
    ctx.setLineDash([]);

    // OHLC info
    var isUp=c.close>=c.open;
    var ohlcHtml='<span>O</span> '+c.open.toFixed(symbolP)+' '+
      '<span>H</span> '+c.high.toFixed(symbolP)+' '+
      '<span>L</span> '+c.low.toFixed(symbolP)+' '+
      '<span>C</span> <span style="color:'+(isUp?'#10b981':'#ef4444')+'">'+c.close.toFixed(symbolP)+'</span>';
    document.getElementById('ohlcInfo').innerHTML=ohlcHtml;
  }

  // Update OHLC from last candle if no hover
  if(hoveredCandle<0 && visible.length>0){
    var c=visible[visible.length-1];
    var isUp=c.close>=c.open;
    var ohlcHtml='<span>O</span> '+c.open.toFixed(symbolP)+' '+
      '<span>H</span> '+c.high.toFixed(symbolP)+' '+
      '<span>L</span> '+c.low.toFixed(symbolP)+' '+
      '<span>C</span> <span style="color:'+(isUp?'#10b981':'#ef4444')+'">'+c.close.toFixed(symbolP)+'</span>';
    document.getElementById('ohlcInfo').innerHTML=ohlcHtml;
  }

  // Current price line
  if(visible.length>0){
    var last=visible[visible.length-1];
    var yP=priceToY(last.close);
    var isUp=last.close>=last.open;
    ctx.strokeStyle=isUp?'#10b981':'#ef4444';
    ctx.lineWidth=0.8;
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(chartLeft,yP);ctx.lineTo(chartRight,yP);ctx.stroke();
    ctx.setLineDash([]);
    // Price tag
    ctx.fillStyle=isUp?'#10b981':'#ef4444';
    var tagW=58,tagH=18;
    ctx.fillRect(chartRight+1,yP-tagH/2,tagW,tagH);
    ctx.fillStyle='#fff';
    ctx.font='bold 10px sans-serif';
    ctx.textAlign='left';
    ctx.fillText(last.close.toFixed(prec(activeSymbol||'EURUSD')),chartRight+5,yP+4);
  }
}

// ─── CHART INTERACTION ─────────────────────────────────────────
function getChartXY(evt){
  var cont=document.getElementById('chartContainer');
  var rect=cont.getBoundingClientRect();
  var x=evt.clientX-rect.left;
  var y=evt.clientY-rect.top;
  return {x:x,y:y,rect:rect};
}

function findCandleAtX(clientX){
  var cont=document.getElementById('chartContainer');
  var rect=cont.getBoundingClientRect();
  var mx=clientX-rect.left;
  var MARGIN_LEFT=10;
  var MARGIN_RIGHT=60;
  var chartWidth=(cont.clientWidth-MARGIN_LEFT-MARGIN_RIGHT);
  var candleW=Math.max(3,Math.min(20,chartWidth/60));
  var gap=Math.max(1,candleW*0.2);
  var totalCandleW=candleW+gap;
  var maxVisible=Math.floor(chartWidth/totalCandleW);
  var endIdx=candles.length-Math.max(0,Math.min(panOffset,maxVisible));
  var startIdx=Math.max(0,endIdx-maxVisible);
  var idx=Math.floor((mx-MARGIN_LEFT)/totalCandleW);
  if(idx>=0&&idx<(endIdx-startIdx)){
    return startIdx+idx;
  }
  return -1;
}

function onDragStart(e){
  isDragging=true;
  lastTouchX=e.clientX;
}
function onDragMove(e){
  var pos=getChartXY(e);
  // Pan
  if(isDragging){
    var dx=e.clientX-lastTouchX;
    var MARGIN_LEFT=10,MARGIN_RIGHT=60;
    var chartWidth=(chartW-MARGIN_LEFT-MARGIN_RIGHT);
    var candleW=Math.max(3,Math.min(20,chartWidth/60));
    var gap=Math.max(1,candleW*0.2);
    var totalCandleW=candleW+gap;
    var candlesShifted=Math.round(dx/totalCandleW);
    if(candlesShifted!==0){
      panOffset=Math.max(0,Math.min(candles.length-candles.length,panOffset-candlesShifted));
      // panOffset 0 = latest candles visible; positive = scrolled back
      panOffset=panOffset+candlesShifted;
      if(panOffset<0) panOffset=0;
      if(panOffset>candles.length-10) panOffset=candles.length-10;
      lastTouchX=e.clientX;
      renderChart();
    }
  }
  // Hover
  var candleIdx=findCandleAtX(e.clientX);
  if(candleIdx!==hoveredCandle){
    hoveredCandle=candleIdx;
    renderChart();
  }
}
function onDragEnd(){isDragging=false;hoveredCandle=-1;renderChart()}

function onTouchStart(e){
  if(e.touches.length===1){
    e.preventDefault();
    isDragging=true;
    lastTouchX=e.touches[0].clientX;
  }
}
function onTouchMove(e){
  if(e.touches.length===1){
    e.preventDefault();
    var touch=e.touches[0];
    if(isDragging){
      var dx=touch.clientX-lastTouchX;
      var MARGIN_LEFT=10,MARGIN_RIGHT=60;
      var chartWidth=(chartW-MARGIN_LEFT-MARGIN_RIGHT);
      var candleW=Math.max(3,Math.min(20,chartWidth/60));
      var gap=Math.max(1,candleW*0.2);
      var totalCandleW=candleW+gap;
      var candlesShifted=Math.round(dx/totalCandleW);
      if(candlesShifted!==0){
        panOffset=panOffset+candlesShifted;
        if(panOffset<0) panOffset=0;
        if(panOffset>candles.length-10) panOffset=candles.length-10;
        lastTouchX=touch.clientX;
        renderChart();
      }
    }
  }
}
function onTouchEnd(){isDragging=false;hoveredCandle=-1;renderChart()}

// ─── INIT ──────────────────────────────────────────────────────
function init(){
  // Prevent pull-to-refresh
  document.body.addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});
  document.addEventListener('gesturestart',function(e){e.preventDefault()});
  try{history.replaceState({page:'watchlist'},'',location.href)}catch(e){}
  window.addEventListener('popstate',function(e){
    if(currentPage==='chart') closeChart();
  });

  // Error dismiss
  document.getElementById('errDismiss').addEventListener('click',hideErr);

  // Back button
  document.getElementById('backBtn').addEventListener('click',closeChart);

  // Init canvas
  initChart();

  // Render watchlist
  renderWatchlist();

  // Fetch prices
  fetchPrices();

  // Poll prices every 15s
  setInterval(fetchPrices,15000);

  // Show connection error after 8s if no data
  setTimeout(function(){
    if(Object.keys(prices).length===0){
      showErr('Connection Error','Unable to reach the data server. Check your internet connection and try again.');
    }
  },8000);
}

// ─── START ─────────────────────────────────────────────────────
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else {
  init();
}
})();
</script>
