<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TradeVision</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://market-stream.mamali163345.workers.dev/lib.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;outline:none}
html,body{position:fixed;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#0a0e14;color:#c5c8c9;font-family:-apple-system,BlinkMacSystemFont,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#131722;border-bottom:1px solid #1e222d}
.hdr-title{font-size:14px;font-weight:700;color:#d1d4dc}
.hdr-sym{font-size:13px;color:#787b86;cursor:pointer}
.hdr-price{font-size:14px;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#131722;border-top:1px solid #1e222d;z-index:100}
.nav-btn{flex:1;text-align:center;padding:8px 0;font-size:10px;color:#787b86;cursor:pointer}
.nav-btn.on{color:#2196f3}
.pg{display:none;position:absolute;top:0;left:0;right:0;bottom:48px;overflow:hidden}
.pg.on{display:block}
.wl{overflow-y:auto;height:100%}
.wl-row{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #1e222d;cursor:pointer}
.wl-row:active{background:#1e222d}
.wl-sym{width:60px;font-size:14px;font-weight:600;color:#d1d4dc}
.wl-name{flex:1;font-size:12px;color:#787b86}
.wl-price{width:80px;text-align:right;font-size:14px;font-weight:600}
.wl-chg{width:70px;text-align:right;font-size:12px}
.up{color:#26a69a}.dn{color:#ef5350}
.ch-wrap{display:flex;flex-direction:column;height:100%}
.ch-bar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;background:#131722;border-bottom:1px solid #1e222d;flex-shrink:0}
.ch-sym{font-size:14px;font-weight:600;color:#d1d4dc}
.ch-price{font-size:14px;font-weight:700}
.ch-chg{font-size:11px;padding:2px 6px;border-radius:3px}
.ch-chg.up{background:rgba(38,166,154,.15);color:#26a69a}
.ch-chg.dn{background:rgba(239,83,80,.15);color:#ef5350}
.ch-live{font-size:9px;color:#26a69a;display:flex;align-items:center;gap:3px}
.ch-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#26a69a;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ohlc{display:flex;gap:8px;padding:2px 10px;font-size:10px;color:#787b86;background:#131722;flex-shrink:0}
.ohlc b{color:#d1d4dc}
.tf-bar{display:flex;gap:4px;padding:4px 10px;background:#131722;border-bottom:1px solid #1e222d;flex-shrink:0}
.tf-btn{padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;color:#787b86;background:#1e222d;border:none}
.tf-btn.on{background:#2196f3;color:#fff}
.chart-box{flex:1;position:relative;overflow:hidden;touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none}
.chart-box div{touch-action:none}
.chart-box canvas{touch-action:none}
#chartEl{width:100%;height:100%}
.load-ind{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(19,23,34,.95);padding:8px 16px;border-radius:6px;border:1px solid #1e222d;display:none;font-size:11px;color:#787b86}
.load-ind.on{display:flex;align-items:center;gap:6px}
.spin{width:12px;height:12px;border:2px solid #1e222d;border-top-color:#2196f3;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#787b86;font-size:14px;text-align:center;padding:40px}
.toast{position:fixed;top:40px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:6px;font-size:12px;z-index:999;display:none}
.toast.on{display:block;background:#26a69a;color:#000}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-title">TradeVision</div>
  <div class="hdr-sym" id="hdrSym">XAU/USD</div>
  <div class="hdr-price" id="hdrPrice" style="color:#787b86">—</div>
</div>
<div id="pgWL" class="pg on"><div class="wl" id="wlList"></div></div>
<div id="pgCH" class="pg">
  <div class="ch-wrap">
    <div class="ch-bar">
      <div><span class="ch-sym" id="chSym">XAU/USD</span> <span class="ch-live" id="chLive" style="display:none">LIVE</span></div>
      <div style="text-align:right"><div class="ch-price" id="chPrice">—</div><div class="ch-chg" id="chChg">—</div></div>
    </div>
    <div class="ohlc" id="ohlc">O — H — L — C</div>
    <div class="tf-bar" id="tfBar"></div>
    <div class="chart-box" id="chartBox">
      <div id="chartEl"></div>
      <div class="load-ind" id="loadInd"><div class="spin"></div>Loading…</div>
    </div>
  </div>
</div>
<div id="pgAL" class="pg"><div class="placeholder">🔔 Alerts<br>Coming soon</div></div>
<div id="pgST" class="pg"><div class="placeholder">⚙️ Settings<br>v7.0 · WebSocket Live</div></div>
<div class="nav">
  <div class="nav-btn on" onclick="showPg('WL')">📋 Watchlist</div>
  <div class="nav-btn" onclick="showPg('CH')">📈 Chart</div>
  <div class="nav-btn" onclick="showPg('AL')">🔔 Alerts</div>
  <div class="nav-btn" onclick="showPg('ST')">⚙️ Settings</div>
</div>
<div class="toast" id="toast"></div>
<script>
var PROXY='https://market-stream.mamali163345.workers.dev';
var SYMBOLS=[
  {sym:'XAUUSD',name:'Gold',display:'XAU/USD',color:'#f0b90b',cat:'metals',prec:2,minMove:0.01},
  {sym:'XAGUSD',name:'Silver',display:'XAG/USD',color:'#c0c0c0',cat:'metals',prec:3,minMove:0.001},
  {sym:'WTI',name:'WTI Oil',display:'WTI/USD',color:'#8B4513',cat:'energy',prec:3,minMove:0.001},
  {sym:'BRENT',name:'Brent',display:'BRENT/USD',color:'#A0522D',cat:'energy',prec:3,minMove:0.001},
  {sym:'EURUSD',name:'Euro',display:'EUR/USD',color:'#003399',cat:'forex',prec:5,minMove:0.00001},
  {sym:'GBPUSD',name:'Pound',display:'GBP/USD',color:'#C8102E',cat:'forex',prec:5,minMove:0.00001},
  {sym:'USDJPY',name:'Yen',display:'USD/JPY',color:'#BC002D',cat:'forex',prec:3,minMove:0.001},
  {sym:'AUDUSD',name:'Aussie',display:'AUD/USD',color:'#00008B',cat:'forex',prec:5,minMove:0.00001},
  {sym:'USDCHF',name:'Swiss',display:'USD/CHF',color:'#D52B1E',cat:'forex',prec:5,minMove:0.00001},
  {sym:'USDCAD',name:'Loonie',display:'USD/CAD',color:'#FF0000',cat:'forex',prec:5,minMove:0.00001},
  {sym:'NZDUSD',name:'Kiwi',display:'NZD/USD',color:'#00247D',cat:'forex',prec:5,minMove:0.00001},
  {sym:'EURGBP',name:'EUR/GBP',display:'EUR/GBP',color:'#003399',cat:'forex',prec:5,minMove:0.00001},
  {sym:'EURJPY',name:'EUR/JPY',display:'EUR/JPY',color:'#003399',cat:'forex',prec:3,minMove:0.001},
  {sym:'GBPJPY',name:'GBP/JPY',display:'GBP/JPY',color:'#C8102E',cat:'forex',prec:3,minMove:0.001},
  {sym:'BTC-USDT',name:'Bitcoin',display:'BTC/USDT',color:'#f7931a',cat:'crypto',prec:2,minMove:0.01},
  {sym:'ETH-USDT',name:'Ethereum',display:'ETH/USDT',color:'#627eea',cat:'crypto',prec:2,minMove:0.01},
  {sym:'SOL-USDT',name:'Solana',display:'SOL/USDT',color:'#9945ff',cat:'crypto',prec:2,minMove:0.01},
];
var TIMEFRAMES=[{id:'1m',l:'1m'},{id:'5m',l:'5m'},{id:'15m',l:'15m'},{id:'1H',l:'1H'},{id:'4H',l:'4H'},{id:'1D',l:'1D'}];
var cur=SYMBOLS[0],tf='15m',prices={},candles=[],page='WL';
var chart=null,candleSeries=null,volumeSeries=null,seqId=0,loadingMore=false;
var wsConn=null,wsReconnectTimer=null;
function fp(v,p){return v!=null?Number(v).toFixed(p!=null?p:2):'—'}
function pct(v){return v>=0?'+'+v.toFixed(2)+'%':v.toFixed(2)+'%'}
function toast(m){var e=document.getElementById('toast');e.textContent=m;e.className='toast on';setTimeout(function(){e.className='toast'},2000)}
function showPg(n){page=n;document.querySelectorAll('.pg').forEach(function(p){p.className='pg'});document.getElementById('pg'+n).className='pg on';document.querySelectorAll('.nav-btn').forEach(function(b,i){b.className=['WL','CH','AL','ST'].indexOf(n)===i?'nav-btn on':'nav-btn'});if(n==='CH'){setTimeout(function(){initChart();loadCandles(cur.sym,tf);connectWS(cur.sym)},50)}else{disconnectWS()}}
// WATCHLIST
function buildWL(){var h='';SYMBOLS.forEach(function(s){var p=prices[s.sym]||{};var last=p.mid!=null?Number(p.mid):0;var open=p.open!=null?Number(p.open):0;var chg=open>0?((last-open)/open*100):0;var c=chg>0?'up':chg<0?'dn':'';h+='<div class="wl-row" onclick="goChart(\''+s.sym+'\')"><div class="wl-sym">'+s.display+'</div><div class="wl-name">'+s.name+'</div><div class="wl-price '+c+'">'+(last?fp(last,s.prec):'—')+'</div><div class="wl-chg '+c+'">'+(last?pct(chg):'')+'</div></div>'});document.getElementById('wlList').innerHTML=h}
function goChart(sym){var s=SYMBOLS.find(function(x){return x.sym===sym});if(!s)return;cur=s;document.getElementById('hdrSym').textContent=s.display;showPg('CH')}
function fetchPrices(){var oSyms=SYMBOLS.filter(function(s){return s.cat!=='crypto'}).map(function(s){return s.sym});if(oSyms.length)fetch(PROXY+'/price?symbols='+oSyms.join(',')).then(function(r){return r.json()}).then(function(d){if(!d.prices)return;d.prices.forEach(function(p){if(p.mid!=null){var old=prices[p.symbol]||{};prices[p.symbol]={mid:p.mid,bid:p.bid,ask:p.ask,open:p.open||old.open,time:p.time}});if(page==='WL')buildWL();if(page==='CH')updateChHeader()}).catch(function(){})}
// WEBSOCKET — LIVE TICKS
function connectWS(sym){
  disconnectWS();
  if(!sym||cur.cat==='crypto')return;
  var url=PROXY.replace('https://','wss://')+'/stream?symbol='+sym;
  try{
    wsConn=new WebSocket(url);
    wsConn.onopen=function(){document.getElementById('chLive').style.display='';console.log('[WS CONNECTED]',sym)};
    wsConn.onmessage=function(e){
      try{
        var d=JSON.parse(e.data);
        if(d.type==='tick'){
          console.log('[TICK]',d.symbol,d.mid.toFixed(cur.prec));
          prices[d.symbol]={mid:d.mid,bid:d.bid,ask:d.ask,time:d.time};
          updateLiveCandle(d.mid);
          updateChHeader();
        }
      }catch(x){}
    };
    wsConn.onclose=function(){document.getElementById('chLive').style.display='none';console.log('[WS CLOSED] reconnecting...');wsReconnectTimer=setTimeout(function(){if(page==='CH')connectWS(sym)},3000)};
    wsConn.onerror=function(){};
  }catch(e){}
}
function disconnectWS(){if(wsConn){try{wsConn.close()}catch(e){}wsConn=null}if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null}document.getElementById('chLive').style.display='none'}
// LIVE CANDLE UPDATE
function updateLiveCandle(price){
  if(!candleSeries||!candles.length||price<=0)return;
  var last=candles[candles.length-1];
  var now=Math.floor(Date.now()/1000);
  var tfSecs={'1m':60,'5m':300,'15m':900,'1H':3600,'4H':14400,'1D':86400};
  var secs=tfSecs[tf]||900;
  var curStart=Math.floor(now/secs)*secs;
  if(curStart>last.time){
    var nc={time:curStart,open:last.close,high:price,low:price,close:price,volume:0};
    candles.push(nc);
    candleSeries.update(nc);
    volumeSeries.update({time:curStart,value:0,color:'rgba(38,166,154,.3)'});
  }else{
    if(price>last.high)last.high=price;
    if(price<last.low)last.low=price;
    last.close=price;
    candleSeries.update({time:last.time,open:last.open,high:last.high,low:last.low,close:last.close});
  }
  updateChHeader();
}
// CHART
function initChart(){
  if(chart)return;
  var el=document.getElementById('chartEl');
  chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:el.clientHeight||400,layout:{background:{color:'#0a0e14'},textColor:'#787b86',fontSize:11},grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},timeScale:{timeVisible:true,secondsVisible:false,rightOffset:5,barSpacing:6,fixLeftEdge:false,fixRightEdge:false,shiftVisibleRangeOnNewBar:false},rightPriceScale:{borderVisible:false,autoScale:true},handleScroll:{vertTouchDrag:false,horzTouchDrag:true,mouseWheel:true,pressedMouseMove:true,horzDrag:true},handleScale:{axisPressedMouseMove:{time:true,price:true},mouseWheel:true,pinch:true,resetDoubleTap:true}});
  candleSeries=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderUpColor:'#26a69a',borderDownColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
  volumeSeries=chart.addHistogramSeries({color:'#26a69a',priceFormat:{type:'volume'},priceScaleId:'vol'});
  chart.priceScale('vol').applyOptions({scaleMargins:{top:.85,bottom:0}});
  chart.subscribeCrosshairMove(function(p){if(!p||!p.time||!p.seriesData)return;var cv=p.seriesData.get(candleSeries);if(!cv)return;var pr=cur.prec;document.getElementById('ohlc').innerHTML='<b>O</b> '+fp(cv.open,pr)+' <b>H</b> <span class="up">'+fp(cv.high,pr)+'</span> <b>L</b> <span class="dn">'+fp(cv.low,pr)+'</span> <b>C</b> '+fp(cv.close,pr)});
  chart.timeScale().subscribeVisibleLogicalRangeChange(function(r){if(!r||!candles||candles.length<2)return;if(r.from<=10)loadMoreHistory()});
  var rt=null;new ResizeObserver(function(){if(rt)clearTimeout(rt);rt=setTimeout(function(){if(chart&&el)chart.applyOptions({width:el.clientWidth,height:el.clientHeight})},100)}).observe(el);
  applyPrecision();
}
function applyPrecision(){if(candleSeries&&cur)candleSeries.applyOptions({priceFormat:{type:'price',precision:cur.prec,minMove:cur.minMove}})}
function loadCandles(sym,tf){
  var mySeq=++seqId;candles=[];
  var symObj=SYMBOLS.find(function(s){return s.sym===sym});
  var isCrypto=symObj&&symObj.cat==='crypto';
  if(isCrypto){
    fetch('https://www.okx.com/api/v5/market/candles?instId='+sym+'&bar='+tf+'&limit=300').then(function(r){return r.json()}).then(function(d){if(mySeq!==seqId||!d||!d.data)return;candles=d.data.reverse().map(function(c){return{time:parseInt(c[0])/1000,open:parseFloat(c[1]),high:parseFloat(c[2]),low:parseFloat(c[3]),close:parseFloat(c[4]),volume:parseFloat(c[5])}}).filter(function(c,i,a){return i===0||a[i-1].time!==c.time});setChartData()}).catch(function(){});
  }else{
    fetch(PROXY+'/candles?symbol='+sym+'&timeframe='+tf+'&count=500').then(function(r){return r.json()}).then(function(d){if(mySeq!==seqId||!d||!d.candles)return;candles=d.candles;setChartData();if(symObj)applyPrecision()}).catch(function(){});
  }
}
function setChartData(){if(!candleSeries||!candles.length)return;candleSeries.setData(candles);volumeSeries.setData(candles.map(function(c){return{time:c.time,value:c.volume||0,color:c.close>=c.open?'rgba(38,166,154,.3)':'rgba(239,83,80,.3)'}}));chart.timeScale().fitContent();updateChHeader()}
function loadMoreHistory(){
  if(!cur||loadingMore||!candles.length)return;loadingMore=true;
  var oldest=candles[0].time,mySeq=++seqId;
  document.getElementById('loadInd').className='load-ind on';
  var isCrypto=cur.cat==='crypto';
  if(isCrypto){
    fetch('https://www.okx.com/api/v5/market/history-candles?instId='+cur.sym+'&bar='+tf+'&limit=100&after='+(oldest*1000)).then(function(r){return r.json()}).then(function(d){if(mySeq!==seqId||!d||!d.data||!d.data.length){loadingMore=false;document.getElementById('loadInd').className='load-ind';return}var nc=d.data.reverse().map(function(c){return{time:parseInt(c[0])/1000,open:parseFloat(c[1]),high:parseFloat(c[2]),low:parseFloat(c[3]),close:parseFloat(c[4]),volume:parseFloat(c[5])}}).filter(function(c){return!candles.some(function(e){return e.time===c.time})&&!isNaN(c.open)});if(nc.length){candles=nc.concat(candles);setChartData();toast('+'+nc.length+' candles')}loadingMore=false;document.getElementById('loadInd').className='load-ind'}).catch(function(){loadingMore=false;document.getElementById('loadInd').className='load-ind'});
  }else{
    fetch(PROXY+'/candles?symbol='+cur.sym+'&timeframe='+tf+'&count=500&before='+(oldest-1)).then(function(r){return r.json()}).then(function(d){if(mySeq!==seqId||!d||!d.candles||!d.candles.length){loadingMore=false;document.getElementById('loadInd').className='load-ind';return}var exist={};candles.forEach(function(c){exist[c.time]=true});var nc=d.candles.filter(function(c){return!exist[c.time]});if(nc.length){candles=nc.concat(candles);setChartData();toast('+'+nc.length+' candles')}loadingMore=false;document.getElementById('loadInd').className='load-ind'}).catch(function(){loadingMore=false;document.getElementById('loadInd').className='load-ind'});
  }
}
function updateChHeader(){var p=prices[cur.sym];if(!p||!p.mid)return;var last=Number(p.mid),open=Number(p.open||0);var chg=open>0?((last-open)/open*100):0;var c=chg>=0?'up':'dn';document.getElementById('chPrice').textContent=fp(last,cur.prec);document.getElementById('chPrice').className='ch-price '+c;var ce=document.getElementById('chChg');ce.textContent=pct(chg);ce.className='ch-chg '+c;document.getElementById('hdrPrice').textContent=fp(last,cur.prec);document.getElementById('hdrPrice').style.color=chg>=0?'#26a69a':'#ef5350'}
function buildTFBar(){var h='';TIMEFRAMES.forEach(function(t){h+='<div class="tf-btn'+(t.id===tf?' on':'')+'" onclick="setTF(\''+t.id+'\')">'+t.l+'</div>'});document.getElementById('tfBar').innerHTML=h}
function setTF(t){tf=t;buildTFBar();loadCandles(cur.sym,tf);if(page==='CH')connectWS(cur.sym)}
function init(){
  history.pushState(null,"",location.href);
  window.addEventListener("popstate",function(){history.pushState(null,"",location.href)});
  document.addEventListener("touchmove",function(e){if(e.target===document.body)e.preventDefault()},{passive:false});
  buildWL();buildTFBar();fetchPrices();setInterval(fetchPrices,5000)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
</body>
</html>
